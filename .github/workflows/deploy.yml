name: Verify and deploy production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY PRODUCTION"
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -m compileall -q bot.py cogs config models service tools scripts e2e_runtime views
          python -m pytest tests/unit -q
          python tools/balance_v2.py audit
      - name: Verify generated balance data is committed
        run: |
          python tools/balance_v2.py generate --write
          git diff --exit-code -- data docs

  deploy:
    needs: verify
    if: github.event.inputs.confirmation == 'DEPLOY PRODUCTION'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Build release archive
        run: |
          tar \
            --exclude=.git --exclude=.github --exclude=.venv --exclude=venv \
            --exclude=.env --exclude='.env.*' --exclude=__pycache__ \
            -czf "/tmp/cuhabot-${GITHUB_SHA}.tgz" .
      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
      - name: Configure SSH
        run: |
          RAW_HOST="${{ secrets.SSH_HOST }}"
          HOST=$(echo "$RAW_HOST" | sed -E 's#^https?://##; s#/.*$##; s#:.*$##')
          test -n "$HOST"
          echo "SSH_HOST_RESOLVED=$HOST" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Open authenticated SSH tunnel
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          test -n "$CF_ACCESS_CLIENT_ID" && test -n "$CF_ACCESS_CLIENT_SECRET"
          cloudflared access tcp \
            --hostname "$SSH_HOST_RESOLVED" \
            --service-token-id "$CF_ACCESS_CLIENT_ID" \
            --service-token-secret "$CF_ACCESS_CLIENT_SECRET" \
            --url 127.0.0.1:2222 >/tmp/cloudflared.log 2>&1 &
          for i in $(seq 1 20); do nc -z 127.0.0.1 2222 && exit 0; sleep 1; done
          tail -n 100 /tmp/cloudflared.log
          exit 1
      - name: Upload and activate timestamped release
        run: |
          SSH="ssh -p 2222 -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@127.0.0.1"
          SCP="scp -P 2222 -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa"
          $SCP "/tmp/cuhabot-${GITHUB_SHA}.tgz" "${{ secrets.SSH_USER }}@127.0.0.1:/tmp/cuhabot-${GITHUB_SHA}.tgz"
          $SSH "set -eu; release=/mnt/CUHA_BOT/releases/${GITHUB_SHA}; mkdir -p \"\$release\"; tar -xzf /tmp/cuhabot-${GITHUB_SHA}.tgz -C \"\$release\"; chmod +x \"\$release/deploy/production/activate-release.sh\"; \"\$release/deploy/production/activate-release.sh\" \"\$release\"; rm -f /tmp/cuhabot-${GITHUB_SHA}.tgz"
